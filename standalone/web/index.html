<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RMBG 去背景</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <button id="sideToggle" title="参数">☰</button>
      <img class="logo" src="/icon.svg" alt="" />
      <span>RMBG 去背景</span>
    </header>
    <main>
      <aside class="panel" id="panel">
        <div class="sheet-head">
          <span>参数</span>
          <button class="btn small ghost" id="sideClose">✕</button>
        </div>
        <label>模型</label>
        <select id="model"></select>

        <label>处理分辨率 <span class="val" id="res_val"></span></label>
        <input
          type="range"
          id="res"
          min="256"
          max="2048"
          step="64"
          value="1024"
        />

        <label>灵敏度 <span class="val" id="sens_val"></span></label>
        <input type="range" id="sens" min="0" max="1" step="0.01" value="1" />

        <label>边缘羽化 <span class="val" id="blur_val"></span></label>
        <input type="range" id="blur" min="0" max="16" step="1" value="0" />

        <label>边缘收缩/扩张 <span class="val" id="off_val"></span></label>
        <input type="range" id="off" min="-20" max="20" step="1" value="0" />

        <label class="row"
          ><input type="checkbox" id="refine" /> 前景边缘优化（较慢）</label
        >

        <button class="btn run" id="run" disabled>开始去背景</button>
        <div id="status"></div>
      </aside>
      <div class="backdrop" id="backdrop"></div>
      <div class="viewwrap">
        <section class="viewer" id="viewer">
          <div class="drop" id="drop">
            <svg
              class="drop-icon"
              width="44"
              height="44"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <rect x="3" y="3" width="18" height="18" rx="3" />
              <circle cx="9" cy="9" r="2" />
              <path d="m3 17 5-5 4 4 3-3 6 6" />
            </svg>
            <div class="hint">拖拽图片到这里，或点击选择</div>
            <div class="sub">PNG / JPG / WebP · 输出透明 PNG</div>
            <input type="file" id="file" accept="image/*" hidden />
          </div>
          <div id="cmp" style="display: none">
            <img id="beforeImg" class="cmp-img" alt="原图" />
            <img id="afterImg" class="cmp-img" alt="结果" />
            <div id="divider"></div>
          </div>
          <div class="bar" id="bar" style="display: none">
            <span class="name" id="fname"></span>
            <span id="time"></span>
            <span class="spacer"></span>
            <button class="btn small ghost" id="download" disabled>
              下载 PNG
            </button>
            <button class="btn small ghost" id="change">更换</button>
          </div>
          <div class="busy" id="busy" style="display: none">
            <div class="spinner"></div>
            <div>处理中… CPU 推理较慢，请耐心等待</div>
          </div>
        </section>
      </div>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
